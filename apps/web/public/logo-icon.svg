<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="mpIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#004d47" />
      <stop offset="50%" stopColor="#00635e" />
      <stop offset="100%" stopColor="#0f766e" />
    </linearGradient>
    <linearGradient id="mpIconPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#2dd4bf" />
      <stop offset="50%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#34d399" />
    </linearGradient>
    <filter id="mpIconDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" floodColor="#002b28" floodOpacity="0.3" />
    </filter>
  </defs>

  <rect width="48" height="48" rx="12" fill="url(#mpIconBg)" />
  
  <!-- Hexagonal matrix -->
  <path d="M24 6L39 15V33L24 42L9 33V15L24 6Z" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="2 3" opacity="0.35"/>
  
  <!-- Neural nodes -->
  <circle cx="24" cy="11" r="2" fill="#2dd4bf" opacity="0.7" />
  <circle cx="13" cy="20" r="1.75" fill="#2dd4bf" opacity="0.6" />
  <circle cx="35" cy="20" r="1.75" fill="#2dd4bf" opacity="0.6" />
  <circle cx="15" cy="35" r="1.75" fill="#2dd4bf" opacity="0.5" />
  <circle cx="33" cy="35" r="1.75" fill="#2dd4bf" opacity="0.5" />
  
  <line x1="24" y1="11" x2="13" y2="20" stroke="#2dd4bf" stroke-width="0.8" opacity="0.3" />
  <line x1="24" y1="11" x2="35" y2="20" stroke="#2dd4bf" stroke-width="0.8" opacity="0.3" />

  <!-- ECG Pulse Waveform -->
  <path d="M8 25.5H16L18.5 21L21 28.5L24 13L27.5 35L30.5 23L33 27H40" stroke="url(#mpIconPulse)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#mpIconDropShadow)" />
  
  <!-- Intelligence Spark Peak -->
  <circle cx="24" cy="13" r="2.5" fill="#ffffff" />
  <circle cx="24" cy="13" r="1.6" fill="#2dd4bf" />
  <path d="M38 23L41 25.5L38 28" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
